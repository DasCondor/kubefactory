apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app: redis, kubefactory/app: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "60", "1", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{containerPort: 6379}]
          readinessProbe:
            tcpSocket: {port: 6379}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {kubefactory/app: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
