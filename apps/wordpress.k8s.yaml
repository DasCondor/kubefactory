apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  labels: {kubefactory/app: wordpress}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels: {app: mysql, kubefactory/app: wordpress}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{containerPort: 3306}]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-db, key: password}
            - {name: MYSQL_DATABASE, value: wordpress}
          readinessProbe:
            tcpSocket: {port: 3306}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: {kubefactory/app: wordpress}
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: 3306}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels: {app: wordpress, kubefactory/app: wordpress}
spec:
  replicas: 1
  selector:
    matchLabels: {app: wordpress}
  template:
    metadata:
      labels: {app: wordpress}
    spec:
      containers:
        - name: wordpress
          image: wordpress:6-apache
          ports: [{containerPort: 80}]
          env:
            - {name: WORDPRESS_DB_HOST, value: mysql}
            - {name: WORDPRESS_DB_USER, value: root}
            - {name: WORDPRESS_DB_NAME, value: wordpress}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-db, key: password}
          readinessProbe:
            tcpSocket: {port: 80}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels: {kubefactory/app: wordpress}
spec:
  type: NodePort
  selector: {app: wordpress}
  ports: [{port: 80, targetPort: 80}]
