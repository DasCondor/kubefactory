# Monitoring dashboard: Grafana at http://localhost:3000 (user admin, password in the env
# file Porter tells you about), dashboard "Containers". Prometheus is at :9090.
services:
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${DB_PASSWORD}
      GF_USERS_DEFAULT_THEME: dark
    configs:
      - {source: grafana-datasource, target: /etc/grafana/provisioning/datasources/prometheus.yaml}
      - {source: grafana-dashboards, target: /etc/grafana/provisioning/dashboards/kubefactory.yaml}
      - {source: dashboard-containers, target: /etc/grafana/dashboards/containers.json}
    volumes: ["grafana-data:/var/lib/grafana"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    configs:
      - {source: prometheus, target: /etc/prometheus/prometheus.yml}
    volumes: ["prometheus-data:/prometheus"]
    restart: unless-stopped
  cadvisor:   # per-container CPU, memory and network
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro"]
    restart: unless-stopped
  node-exporter:   # the host itself
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
volumes:
  grafana-data:
  prometheus-data:
configs:
  grafana-datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
  grafana-dashboards:
    content: |
      apiVersion: 1
      providers:
        - name: kubefactory
          type: file
          options:
            path: /etc/grafana/dashboards
  prometheus:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
        - job_name: node
          static_configs:
            - targets: ["node-exporter:9100"]
  dashboard-containers:
    content: |
      {
        "uid": "kubefactory-containers",
        "title": "Containers",
        "tags": [
          "kubefactory"
        ],
        "schemaVersion": 39,
        "version": 1,
        "refresh": "10s",
        "time": {
          "from": "now-30m",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "type": "stat",
            "title": "Running containers",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "count(container_last_seen{name!=\"\"})",
                "legendFormat": ""
              }
            ]
          },
          {
            "id": 2,
            "type": "stat",
            "title": "Host CPU in use",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 6,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[2m]))",
                "legendFormat": ""
              }
            ]
          },
          {
            "id": 3,
            "type": "stat",
            "title": "Host memory in use",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 12,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes",
                "legendFormat": ""
              }
            ]
          },
          {
            "id": 4,
            "type": "stat",
            "title": "Host disk in use (/)",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 18,
              "y": 0,
              "w": 6,
              "h": 4
            },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}",
                "legendFormat": ""
              }
            ]
          },
          {
            "id": 5,
            "type": "timeseries",
            "title": "CPU by container (cores)",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 4,
              "w": 12,
              "h": 8
            },
            "fieldConfig": {
              "defaults": {
                "unit": "none"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (name) (rate(container_cpu_usage_seconds_total{name!=\"\"}[2m]))",
                "legendFormat": "{{name}}"
              }
            ]
          },
          {
            "id": 6,
            "type": "timeseries",
            "title": "Memory by container",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 12,
              "y": 4,
              "w": 12,
              "h": 8
            },
            "fieldConfig": {
              "defaults": {
                "unit": "bytes"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (name) (container_memory_working_set_bytes{name!=\"\"})",
                "legendFormat": "{{name}}"
              }
            ]
          },
          {
            "id": 7,
            "type": "timeseries",
            "title": "Network received by container",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 0,
              "y": 12,
              "w": 12,
              "h": 8
            },
            "fieldConfig": {
              "defaults": {
                "unit": "Bps"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (name) (rate(container_network_receive_bytes_total{name!=\"\"}[2m]))",
                "legendFormat": "{{name}}"
              }
            ]
          },
          {
            "id": 8,
            "type": "timeseries",
            "title": "Network sent by container",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "gridPos": {
              "x": 12,
              "y": 12,
              "w": 12,
              "h": 8
            },
            "fieldConfig": {
              "defaults": {
                "unit": "Bps"
              },
              "overrides": []
            },
            "targets": [
              {
                "refId": "A",
                "expr": "sum by (name) (rate(container_network_transmit_bytes_total{name!=\"\"}[2m]))",
                "legendFormat": "{{name}}"
              }
            ]
          }
        ]
      }
