# Media server suite. Meant for a single-node homelab cluster (k3s, kind, Docker Desktop):
# the `media` and `downloads` volumes are ReadWriteOnce and shared by several pods, which
# only works when those pods land on one node. On a multi-node cluster give both claims a
# ReadWriteMany storage class. App settings live in emptyDir volumes: fine for a demo,
# swap them for claims to keep them across restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  labels: {kubefactory/app: media}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 20Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads
  labels: {kubefactory/app: media}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  labels: {app: plex, kubefactory/app: media}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: plex}
  template:
    metadata:
      labels: {app: plex}
    spec:
      containers:
        - name: plex   # watch
          image: lscr.io/linuxserver/plex:latest
          ports: [{containerPort: 32400}]
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1000"}
            - {name: TZ, value: Etc/UTC}
            - {name: VERSION, value: docker}
          readinessProbe:
            tcpSocket: {port: 32400}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: media, mountPath: /media}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
      volumes:
        - name: config
          emptyDir: {}
        - name: media
          persistentVolumeClaim: {claimName: media}
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  labels: {kubefactory/app: media}
spec:
  type: NodePort
  selector: {app: plex}
  ports: [{port: 32400, targetPort: 32400}]
