# Media server suite. Open the web UIs on this machine:
#   plex :32400   overseerr :5055   sonarr :8989   radarr :7878   lidarr :8686
#   bazarr :6767   jackett :9117   prowlarr :9696   qbittorrent :8080   tautulli :8181
# Put your library in the `media` volume (or swap it for a bind mount to your disks).
# First run: claim Plex at http://localhost:32400/web, add qBittorrent as the download
# client in Sonarr / Radarr / Lidarr, add your indexers in Jackett (http://localhost:9117)
# and paste each one's Torznab feed URL + Jackett's API key into Sonarr / Radarr / Lidarr
# (Settings > Indexers). Prowlarr does the same job and syncs itself: use either. Then
# connect Overseerr to Plex, Sonarr and Radarr.
services:
  plex:   # watch
    image: lscr.io/linuxserver/plex:latest
    ports: ["32400:32400"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC, VERSION: docker}
    volumes: ["plex-config:/config", "media:/media"]
    restart: unless-stopped
  overseerr:   # requests
    image: lscr.io/linuxserver/overseerr:latest
    ports: ["5055:5055"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC}
    volumes: ["overseerr-config:/config"]
    restart: unless-stopped
  sonarr:   # TV
    image: lscr.io/linuxserver/sonarr:latest
    ports: ["8989:8989"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC}
    volumes: ["sonarr-config:/config", "media:/media", "downloads:/downloads"]
    restart: unless-stopped
  radarr:   # films
    image: lscr.io/linuxserver/radarr:latest
    ports: ["7878:7878"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC}
    volumes: ["radarr-config:/config", "media:/media", "downloads:/downloads"]
    restart: unless-stopped
  lidarr:   # music
    image: lscr.io/linuxserver/lidarr:latest
    ports: ["8686:8686"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC}
    volumes: ["lidarr-config:/config", "media:/media", "downloads:/downloads"]
    restart: unless-stopped
  bazarr:   # subtitles
    image: lscr.io/linuxserver/bazarr:latest
    ports: ["6767:6767"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC}
    volumes: ["bazarr-config:/config", "media:/media"]
    restart: unless-stopped
  jackett:   # indexer proxy: one search API for Sonarr / Radarr / Lidarr
    image: lscr.io/linuxserver/jackett:latest
    ports: ["9117:9117"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC}
    volumes: ["jackett-config:/config", "downloads:/downloads"]
    restart: unless-stopped
  prowlarr:   # indexer manager (alternative to Jackett)
    image: lscr.io/linuxserver/prowlarr:latest
    ports: ["9696:9696"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC}
    volumes: ["prowlarr-config:/config"]
    restart: unless-stopped
  qbittorrent:   # download client
    image: lscr.io/linuxserver/qbittorrent:latest
    ports: ["8080:8080"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC, WEBUI_PORT: "8080"}
    volumes: ["qbittorrent-config:/config", "downloads:/downloads"]
    restart: unless-stopped
  tautulli:   # Plex statistics
    image: lscr.io/linuxserver/tautulli:latest
    ports: ["8181:8181"]
    environment: {PUID: "1000", PGID: "1000", TZ: Etc/UTC}
    volumes: ["tautulli-config:/config"]
    restart: unless-stopped
volumes:
  media:
  downloads:
  plex-config:
  overseerr-config:
  sonarr-config:
  radarr-config:
  lidarr-config:
  bazarr-config:
  jackett-config:
  prowlarr-config:
  qbittorrent-config:
  tautulli-config:
