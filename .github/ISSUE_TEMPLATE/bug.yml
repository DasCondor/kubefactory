name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Ideally on the simulation (--demo). Leave out cluster names, addresses and anything secret.
  - type: dropdown
    id: source
    attributes:
      label: Connected to
      options: [Simulation, Kubernetes, Docker, Browser demo, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: e.g. 2.0.0-dev, Windows 11, Standard graphics
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: From the log folder (Esc > Logs). Check them for anything private before pasting.
      render: text
