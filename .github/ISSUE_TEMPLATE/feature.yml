name: Idea
description: Something KubeFactory could do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like to do, and why?
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you imagine it working
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md)
