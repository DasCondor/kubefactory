# Push a tag like v1.0.0 to build the release zip and publish it as a GitHub Release.
# "Run workflow" builds the same zip as a downloadable artifact without releasing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION in scripts/main.gd
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String scripts/main.gd -Pattern 'const VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match VERSION $v" }

      # shortcut: re-downloads ~1 GB of export templates every run; add actions/cache if releases get frequent
      - name: Fetch Godot 4.3 and its Windows export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl.exe -fsSL -o godot.zip "$base/Godot_v4.3-stable_win64.exe.zip"
          curl.exe -fsSL -o tpl.zip "$base/Godot_v4.3-stable_export_templates.tpz"
          # pinned checksums: refuse to build with anything but the official 4.3 files
          $want = @{ "godot.zip" = "ad09b7e19949327700dfbe64e35880a2a08091c0751277f5cc21b915e5df9b4fe93fb43c50d6bdfb9d16b46168592491aa698e0d2dbe9f92132e163dd77b97e1"; "tpl.zip" = "476366caf0fd45a8f24136cf9cf1dc0bc2b96f7c82d53e5f82200b55aefd07b286d283fd6f1ce29e0de70648c5a51d3b12f96c6d4fafd4e8c4878ecda6406d6a" }
          foreach ($f in $want.Keys) {
            if ((Get-FileHash $f -Algorithm SHA512).Hash.ToLower() -ne $want[$f]) { throw "checksum mismatch for $f" }
          }
          Expand-Archive godot.zip engine -Force
          $dst = "$env:APPDATA\Godot\export_templates\4.3.stable"
          New-Item -ItemType Directory -Force $dst | Out-Null
          tar -xf tpl.zip -C $dst --strip-components=1 "templates/windows_*_x86_64*.exe" templates/version.txt
          Remove-Item godot.zip, tpl.zip

      # the native companion (agent/) is built by tools/package.ps1 and needs Go
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Companion tests
        shell: pwsh
        run: ./tools/build-agent.ps1 -Test

      - name: Test, export and zip
        shell: pwsh
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: KubeFactory-win64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*.zip, dist/*.sha256) --generate-notes
