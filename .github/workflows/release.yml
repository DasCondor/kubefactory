# Push a tag like v1.0.0 to build Windows, Linux and macOS packages and
# publish them as a GitHub Release. "Run workflow" builds the same packages as
# downloadable artifacts without releasing.
#
# Every package gets a .sha256, the release gets one SHA256SUMS file, and each
# package gets a signed build-provenance attestation (Sigstore, keyless) that
# ties it to this workflow and commit:
#
#   gh attestation verify <package> -R DasCondor/kubefactory
#
# Windows: the exes are Authenticode-signed through SignPath once it is set up
# (docs/CODE_SIGNING.md); until then they are unsigned, and the job says so by
# skipping the signing steps. macOS: ad-hoc signed only (so Apple Silicon will
# run it), not notarized. Nothing claims more than that.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_BASE: https://github.com/godotengine/godot/releases/download/4.3-stable
  # pinned checksums, as published in Godot's SHA512-SUMS.txt for 4.3-stable
  TPL_SHA512: 476366caf0fd45a8f24136cf9cf1dc0bc2b96f7c82d53e5f82200b55aefd07b286d283fd6f1ce29e0de70648c5a51d3b12f96c6d4fafd4e8c4878ecda6406d6a

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read          # SignPath fetches the unsigned package from this run
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION in scripts/main.gd
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String scripts/main.gd -Pattern 'const VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match VERSION $v" }

      # shortcut: re-downloads ~1 GB of export templates every run; add actions/cache if releases get frequent
      - name: Fetch Godot 4.3 and its Windows export templates
        shell: pwsh
        run: |
          curl.exe -fsSL -o godot.zip "$env:GODOT_BASE/Godot_v4.3-stable_win64.exe.zip"
          curl.exe -fsSL -o tpl.zip "$env:GODOT_BASE/Godot_v4.3-stable_export_templates.tpz"
          $want = @{ "godot.zip" = "ad09b7e19949327700dfbe64e35880a2a08091c0751277f5cc21b915e5df9b4fe93fb43c50d6bdfb9d16b46168592491aa698e0d2dbe9f92132e163dd77b97e1"; "tpl.zip" = $env:TPL_SHA512 }
          foreach ($f in $want.Keys) {
            if ((Get-FileHash $f -Algorithm SHA512).Hash.ToLower() -ne $want[$f]) { throw "checksum mismatch for $f" }
          }
          Expand-Archive godot.zip engine -Force
          $dst = "$env:APPDATA\Godot\export_templates\4.3.stable"
          New-Item -ItemType Directory -Force $dst | Out-Null
          tar -xf tpl.zip -C $dst --strip-components=1 "templates/windows_*_x86_64*.exe" templates/version.txt
          Remove-Item godot.zip, tpl.zip

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Companion tests
        shell: pwsh
        run: ./tools/build-agent.ps1 -Test

      - name: Test, export and zip
        shell: pwsh
        run: ./tools/package.ps1

      # Windows code signing through SignPath (docs/CODE_SIGNING.md). Off until the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN exist; without them the package ships unsigned, as before.
      - name: Upload the unsigned package for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: KubeFactory-windows-unsigned
          path: dist/*-win64.zip

      - name: Sign KubeFactory.exe, KubeFactory.console.exe and kf-agent.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'kubefactory' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600     # a release signing request may wait for a person to approve it
          output-artifact-directory: signed

      - name: Use the signed package, and check every exe in it
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $zip = Get-ChildItem signed -Recurse -Filter "*-win64.zip" | Select-Object -First 1
          if ($zip -eq $null) { throw "SignPath returned no package" }
          Copy-Item $zip.FullName "dist/$($zip.Name)" -Force
          Expand-Archive "dist/$($zip.Name)" check -Force
          $exes = Get-ChildItem check -Recurse -Filter *.exe
          foreach ($e in $exes) {
            $sig = Get-AuthenticodeSignature $e.FullName
            "{0}: {1} ({2})" -f $e.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne "Valid") { throw "$($e.Name) is not validly signed" }
          }
          $hash = (Get-FileHash "dist/$($zip.Name)" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/$($zip.Name).sha256", "$hash  $($zip.Name)`n")

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KubeFactory-windows
          path: |
            dist/*.zip
            dist/*.sha256

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot 4.3 and its Linux export templates
        run: |
          curl -fsSL -o godot.zip "$GODOT_BASE/Godot_v4.3-stable_linux.x86_64.zip"
          curl -fsSL -o tpl.zip "$GODOT_BASE/Godot_v4.3-stable_export_templates.tpz"
          echo "fd52bb4ba8acc30ca5accd1c566d470ad7282f891ccc0995dfafabcf92bcf76280ce182bf9d80ebd885f3ed2165d01e1fc3f2928436b15498dfbd98656c2a45a  godot.zip" | sha512sum -c -
          echo "$TPL_SHA512  tpl.zip" | sha512sum -c -
          unzip -q godot.zip -d "$HOME/godot"
          dst="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$dst"
          unzip -q -j tpl.zip templates/linux_release.x86_64 templates/linux_debug.x86_64 templates/version.txt -d "$dst"
          rm godot.zip tpl.zip

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Companion tests
        run: cd agent && go test ./...

      - name: Test, export and package
        run: GODOT="$HOME/godot/Godot_v4.3-stable_linux.x86_64" bash tools/package.sh linux

      # the high-availability host service (docs/HOST_SERVICE.md): one file per platform, plus its installers
      - name: Build kf-host and stage the server image
        run: |
          mkdir -p server-image
          cd agent
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../dist/kf-host-linux-amd64 ./host
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../dist/kf-host-linux-arm64 ./host
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../dist/kf-host-windows-amd64.exe ./host
          cd ..
          cp deploy/host/install-host.sh deploy/host/install-host.ps1 setup/install-kubefactory.sh setup/install-kubefactory.ps1 dist/
          stage="$(ls -d dist/KubeFactory-*-linux-x86_64 | head -1)"
          cp "$stage/KubeFactory.x86_64" "$stage/kf-agent" deploy/server-image/Dockerfile server-image/

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/kf-host-*
            dist/install-host.*
            dist/install-kubefactory.*

      - uses: actions/upload-artifact@v4
        with:
          name: KubeFactory-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/kf-host-*
            dist/install-host.*
            dist/install-kubefactory.*

      - uses: actions/upload-artifact@v4
        with:
          name: server-image-context
          path: server-image/

  # The server container image kf-host runs. Built on every run; pushed to
  # ghcr.io only for a tag (":latest" only for a release that is not a pre-release).
  server-image:
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-image-context
          path: ctx
      - name: Build, and push for a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/kubefactory-server"
          docker build -t kubefactory-server:ci ctx
          case "$GITHUB_REF" in
            refs/tags/v*)
              v="${GITHUB_REF_NAME#v}"
              echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              docker tag kubefactory-server:ci "$img:$v" && docker push "$img:$v"
              case "$v" in *-*) ;; *) docker tag kubefactory-server:ci "$img:latest" && docker push "$img:latest" ;; esac
              ;;
            *) echo "not a tag: built only" ;;
          esac

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot 4.3 and its macOS export templates
        run: |
          curl -fsSL -o godot.zip "$GODOT_BASE/Godot_v4.3-stable_macos.universal.zip"
          curl -fsSL -o tpl.zip "$GODOT_BASE/Godot_v4.3-stable_export_templates.tpz"
          echo "8a556637aa6b83a60473decdb43a448b214f31fd13318b6f7ba2ebc4cca4e40d1f7a933330ce40afa8d72273ef6a6f3a0e3b0f0abf8e1be3fe4f03119cae62c2  godot.zip" | shasum -a 512 -c -
          echo "$TPL_SHA512  tpl.zip" | shasum -a 512 -c -
          unzip -q godot.zip -d "$HOME/godot"
          dst="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$dst"
          unzip -q -j tpl.zip templates/macos.zip templates/version.txt -d "$dst"
          rm godot.zip tpl.zip

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test, export and package
        run: GODOT="$HOME/godot/Godot.app/Contents/MacOS/Godot" bash tools/package.sh macos

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KubeFactory-macos
          path: |
            dist/*-macos.zip
            dist/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos, server-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: One checksum file for everything
        run: |
          cd out
          sha256sum *.zip *.tar.gz kf-host-* install-host.* install-kubefactory.* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/*.zip out/*.tar.gz out/*.sha256 out/kf-host-* out/install-host.* out/install-kubefactory.* out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes --title "KubeFactory ${GITHUB_REF_NAME#v}" $pre
