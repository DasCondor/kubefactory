name: kf-media-gather

services:
  gather:
    image: syncthing/syncthing:2.1.5
    restart: unless-stopped
    environment:
      PUID: ${SYNC_UID:-1000}
      PGID: ${SYNC_GID:-1000}
    ports:
      - "127.0.0.1:18385:8384"
    volumes:
      - gather-config:/var/syncthing/config
      - ./outbox:/var/syncthing/outbox

volumes:
  gather-config:

